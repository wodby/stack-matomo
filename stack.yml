name: matomo
icon: matomo
docs: https://wodby.com/docs/2.0/stacks/catalog/matomo/
title: Matomo

services:
- name: matomo
  title: Matomo
  service: matomo
  required: true
  volumes:
  - name: files
    size: 5
  links:
  - name: db
    service: mariadb
  - name: files
    service: files-nfs
  - name: sendmail
    service: opensmtpd

- name: mariadb
  title: MariaDB
  service: mariadb
  volumes:
  - name: data
    size: 20

- name: files-nfs
  title: Files NFS storage
  service: nfs-provisioner
  volumes:
  - name: data
    size: 10

- name: opensmtpd
  required: false
  title: OpenSMTPD
  service: opensmtpd
